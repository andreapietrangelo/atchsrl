top:env(safe-area-inset-top,0px);left:0;right:0;z-index:70;transition:background-color .3s var(--ease),box-shadow .3s var(--ease)}\n.header-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;transition:min-height .35s var(--ease)}\n.site-header.is-compact{background:rgba(4,19,44,.97);box-shadow:0 10px 30px rgba(0,0,0,.28);border-bottom:1px solid var(--line-dark)}\n@supports (backdrop-filter:blur(10px)){.site-header.is-compact{background:rgba(4,19,44,.88);backdrop-filter:blur(14px) saturate(1.3)}}\n.site-header.is-compact .header-in{min-height:64px}\n.brand{display:inline-flex;align-items:center;min-height:48px;text-decoration:none;color:#fff;border-radius:var(--r)}\n.brand img{display:none;height:40px;width:auto}\n.brand.has-logo{background:#fff;padding:6px 12px}\n.brand.has-logo img{display:block}\n.brand.has-logo .wm{display:none}\n.wm{display:flex;flex-direction:column;gap:4px;line-height:1}\n.wm-top{display:flex;align-items:baseline;gap:7px}\n.wm b{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:2.05rem;letter-spacing:-.02em;color:#fff}\n.wm b::after{content:\"\";display:inline-block;width:.3em;height:.3em;margin-left:.1em;background:var(--orange);border-radius:1px}\n.wm i{font-family:var(--f-display);font-style:normal;font-weight:600;font-size:1.05rem;color:var(--azure)}\n.wm small{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--on-dark-muted)}\n.nav-toggle{display:none;position:relative;order:3;align-items:center;justify-content:center;width:52px;height:52px;border:1px solid rgba(255,255,255,.4);border-radius:var(--r);background:rgba(4,19,44,.55);color:#fff;cursor:pointer;transition:background-color var(--t-micro),border-color var(--t-micro)}\n.nav-toggle:hover{background:#fff;color:var(--deep);border-color:#fff}\n.nav-toggle .ico-close{display:none}\n.nav-toggle[aria-expanded=\"true\"] .ico-open{display:none}\n.nav-toggle[aria-expanded=\"true\"] t(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/64px 64px,\n  linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/64px 64px,\n  radial-gradient(60% 90% at 90% 10%,rgba(56,182,255,.26),transparent 62%),\n  linear-gradient(135deg,var(--deep),#082456)}\n.hero-stage{position:relative;z-index:1;display:block}\n.scene{position:relative;padding-block:clamp(130px,17vw,190px) clamp(110px,11vw,140px);min-height:clamp(560px,86svh,860px);display:flex;align-items:center}\n.scene + .scene{border-top:1px solid var(--line-dark)}\n.scene-art{position:absolute;inset:0;z-index:0;overflow:hidden}\n.art-inner{position:absolute;inset:0;transform-origin:70% 50%}\n.scene-art::after{content:\"\";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(4,19,44,.94) 0%,rgba(4,19,44,.78) 38%,rgba(4,19,44,.12) 78%),linear-gradient(0deg,rgba(4,19,44,.7),transparent 30%)}\n.art{position:absolute;inset:0;width:100%;height:100%}\n.scene-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s var(--ease);z-index:1}\n.scene-art.has-photo .scene-photo{opacity:1}\n.scene-art.has-photo .art,.scene-art.has-photo .art-tag{visibility:hidden}\n.art-tag{position:absolute;z-index:3;right:var(--gutter);bottom:112px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-muted);padding:6px 10px;border:1px solid var(--line-dark);border-radius:var(--r);background:rgba(4,19,44,.6)}\n.scene-in{position:relative;z-index:3;width:100%}\n.scene-copy{display:grid;gap:22px;justify-items:start;max-width:min(40rem,100%)}\n.hero h1,.hero h2,.band h1,.dark h2,.dark h3,.cta h2{color:#fff}\n.s-title{font-size:clamp(2.5rem,6.4vw,5.6rem);line-height:1.02}\n.s-text{font-size:clamp(1.12rem,1.7vw,1.35rem);line-height:1.55;color:var(--on-dark);max-width:44ch}\n.s-actions{display:flex;flex-wrap:wrap;gap:14px;padding-top:6px}\n/* linee e riflessi in lento movimento */\n.refl{animation:drift 16s ease-i pan class=\"link-arrow\"><span class=\"t\">Vai a Digital Print<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/span><\/div><\/a>\n<a class=\"card card--media c-5\" href=\"macchine.html\"><div class=\"media\" style=\"--ratio:16/10\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Testa di stampa<br>Foto originale AI Srl da inserire in<\/span><code>img/testa-di-stampa.webp<\/code><\/div><img src=\"img/testa-di-stampa.webp\" alt=\"Testa di stampa di una macchina AI Srl\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><div class=\"card-body\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-modules\"/><\/svg><\/span><h3>Macchine modulari<\/h3><p>Struttura modulare che si adatta ai diversi inchiostri: ceramici, IR, UV e ad acqua lavabile.<\/p><span class=\"link-arrow\"><span class=\"t\">Vedi le macchine<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/span><\/div><\/a>\n<a class=\"card card--media c-5\" href=\"macchine.html#controllo-qualita\"><div class=\"media\" style=\"--ratio:16/10\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Sistema di visione<br>Foto originale AI Srl da inserire in<\/span><code>img/sistema-visione-02.webp<\/code><\/div><img src=\"img/sistema-visione-02.webp\" alt=\"Sistema di visione artificiale\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><div class=\"card-body\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-vision\"/><\/svg><\/span><h3>Visione e controllo qualità<\/h3><p>Visione artificiale per orientare il vetro e, su richiesta, controllare la stampa e gestire gli scarti.<\/p><span class=\"link-arrow\"><span class=\"t\">Scopri il controllo<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/span><\/div><\/a>\n<a class=\"card card--media card--big c-7\" href=\"revamping.html\"><div class=\"media\" style=\"--ratio:16/9\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Impianto in revamping<br>Foto originale AI Srl da inserire in<\/span><code>img/diverge-blog-1.jpg<\/code><\/div><img src=\"img/diverge-blog-1.jpg\" alt=\"Impianto industriale oggetto di revamping\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><div class=\"card-body\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-revamp\"/><\/svg><\/span><h3>Revamping<\/h3><p>Recupero e ammodernamento di componenti e tecnologie degli impianti esistenti.<\/p><span class=\"link-arrow\"><span class=\"t\">Vai a Revamping<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/span><\/div><\/a>\n<\/div><\/div><\/section><section class=\"sec dark sec--grid\" data-process><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Come funziona<\/p><h2 data-lines>Dal vetro in ingresso alla stampa controllata<\/h2><p data-reveal>Tre fasi in sequenza lungo la linea. L’ultima è opzionale e si aggiunge su richiesta del cliente finale. Scorri per far avanzare lo schema.<\/p><\/div>\n<div class=\"process-wrap\">\n<div class=\"process-fig glass\"><svg viewBox=\"0 0 900 310\" role=\"img\" aria-labelledby=\"pr-t pr-d\" focusable=\"false\">\n<title id=\"pr-t\">Schema illustrativo del processo<\/title>\n<desc id=\"pr-d\">Un vetro avanza lungo tre fasi: orientamento, stampa digitale e controllo qualità opzionale. Lo schema è illustrativo e non rappresenta tempi, prestazioni o dimensioni reali.<\/desc>\n<g id=\"pr-s1\"><rect class=\"st-frame\" x=\"48\" y=\"50\" width=\"244\" height=\"212\" rx=\"4\"/><text class=\"st-label\" x=\"170\" y=\"36\" text-anchor=\"middle\">1 · Orientamento<\/text><\/g><g id=\"pr-s2\"><rect class=\"st-frame\" x=\"328\" y=\"50\" width=\"244\" height=\"212\" rx=\"4\"/><text class=\"st-label\" x=\"450\" y=\"36\" text-anchor=\"middle\">2 · Stampa digitale<\/text><\/g><g id=\"pr-s3\"><rect class=\"st-frame\" x=\"608\" y=\"50\" width=\"244\" height=\"212\" rx=\"4\"/><text class=\"st-label\" x=\"730\" y=\"36\" text-anchor=\"middle\">3 · Controllo opzionale<\/text><\/g>\n<path d=\"M0 258H900M0 282H900\" stroke=\"#fff\" stroke-opacity=\".35\" fill=\"none\"/><circle cx=\"26\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"70\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"114\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"158\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"202\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"246\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"290\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"334\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"378\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"422\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"466\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"510\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"554\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"598\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"642\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"686\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"730\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"774\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"818\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/><circle cx=\"862\" cy=\"270\" r=\"8\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".4\"/>\n<g id=\"pr-ori\" opacity=\"0\" class=\"ori\"><path d=\"M40 214H300\" stroke=\"#38B6FF\" stroke-dasharray=\"6 5\" fill=\"none\"/><path d=\"M170 100V250\" stroke=\"#38B6FF\" stroke-dasharray=\"6 5\" fill=\"none\"/><path d=\"M236 214A66 66 0 0 0 230 190\" stroke=\"#38B6FF\" stroke-width=\"1.8\" fill=\"none\"/><\/g>\n<g id=\"pr-sheet\" transform=\"translate(730 214) rotate(0)\">\n<path d=\"M-104 33 L-84 -33 Q-81 -41 -72 -41 L72 -41 Q81 -41 84 -33 L104 33 Q105 41 96 41 L-96 41 Q-105 41 -104 33Z\" fill=\"url(#g-glass)\" stroke=\"#fff\" stroke-opacity=\".8\" stroke-width=\"1.6\"/>\n<clipPath id=\"pr-clip\"><path d=\"M-104 33 L-84 -33 Q-81 -41 -72 -41 L72 -41 Q81 -41 84 -33 L104 33 Q105 41 96 41 L-96 41 Q-105 41 -104 33Z\"/><\/clipPath><clipPath id=\"pr-gclip\"><rect id=\"pr-reveal\" x=\"-110\" y=\"-45\" width=\"220\" height=\"90\"/><\/clipPath>\n<g clip-path=\"url(#pr-gclip)\"><g clip-path=\"url(#pr-clip)\"><path d=\"M-112 -46H112V-12H-112Z\" fill=\"url(#p-dots)\"/><path d=\"M-112 -12H112\" stroke=\"#fff\" stroke-opacity=\".5\"/><circle cx=\"0\" cy=\"16\" r=\"15\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/><path d=\"M-26 16H26M0 -10V42\" stroke=\"#fff\" stroke-opacity=\".8\" stroke-width=\"1.5\"/><\/g><\/g>\n<rect id=\"pr-qc\" x=\"-120\" y=\"-54\" width=\"240\" height=\"108\" rx=\"4\" fill=\"none\" stroke=\"#38B6FF\" stroke-width=\"1.6\" stroke-dasharray=\"6 5\" opacity=\"1\"/>\n<\/g>\n<g id=\"pr-head\" transform=\"translate(340 142)\" opacity=\"0\"><rect x=\"-44\" y=\"0\" width=\"88\" height=\"14\" rx=\"2\" fill=\"#0E4FA3\" stroke=\"#fff\" stroke-opacity=\".7\"/><path d=\"M-30 14V22M-15 14V22M0 14V22M15 14V22M30 14V22\" stroke=\"#fff\" fill=\"none\"/><path d=\"M-30 28V38M-15 28V38M0 28V38M15 28V38M30 28V38\" stroke=\"#38B6FF\" stroke-dasharray=\"3 5\" fill=\"none\"/><\/g>\n<g id=\"pr-scan\" transform=\"translate(620 0)\" opacity=\"0\"><rect x=\"-16\" y=\"150\" width=\"32\" height=\"120\" fill=\"url(#g-refl)\" opacity=\".8\"/><path d=\"M0 150V270\" stroke=\"#38B6FF\" stroke-width=\"2\"/><\/g>\n<\/svg><p class=\"fig-tag\">Schema illustrativo · non rappresenta tempi, prestazioni o dimensioni reali<\/p><\/div>\n<div class=\"process-steps\">\n<div class=\"pstep\"><span class=\"num\">Fase 1<\/span><h3>Orientamento del vetro<\/h3><p>Un sistema di visione, sempre presente, si trova prima della testa di stampa. Rileva l’orientamento di ogni pezzo in transito e permette di adattare l’immagine da stampare.<\/p><\/div>\n<div class=\"pstep\"><span class=\"num\">Fase 2<\/span><h3>Stampa digitale<\/h3><p>La testa di stampa applica la grafica sul vetro. Le esigenze di riscaldamento dipendono dall’inchiostro utilizzato: per gli inchiostri IR servono riscaldi prima e dopo la stampa, per gli UV non sono necessari.<\/p><\/div>\n<div class=\"pstep pstep--opt\"><span class=\"num\">Fase 3 · opzionale<\/span><h3>Controllo qualità<\/h3><p>A valle della stampa, su richiesta, un modulo con sistema di visione dedicato controlla il risultato e gestisce gli scarti.<\/p><\/div>\n<\/div><\/div><\/div><\/section><section class=\"sec\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Vantaggi<\/p><h2 data-lines>Perché stampare in digitale sul vetro<\/h2><\/div>\n<div class=\"g12\" data-stagger>\n<div class=\"card c-5\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-sliders\"/><\/svg><\/span><h3>Personalizzazione<\/h3><p>Ogni vetro può essere personalizzato senza realizzare nuove maschere o stencil.<\/p><\/div>\n<div class=\"card c-7\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flex\"/><\/svg><\/span><h3>Flessibilità<\/h3><p>Una soluzione adatta a tirature piccole e grandi, anche per produzioni su richiesta.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-clock\"/><\/svg><\/span><h3>Cambi produzione rapidi<\/h3><p>La preparazione è più rapida rispetto alla serigrafia, per seguire i cambi di design.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><\/span><h3>Qualità<\/h3><p>Grafiche nitide e dettagliate; con il modulo opzionale, controllo della stampa e supporto all’operatore.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-drop\"/><\/svg><\/span><h3>Meno sprechi<\/h3><p>L’uso ottimizzato dell’inchiostro e il controllo dei difetti aiutano a contenere gli scarti.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"sec sec--paper sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Macchine e Logo Print<\/p><h2 data-lines>Macchine modulari e stampa di piccoli loghi<\/h2><\/div>\n<div class=\"g12\" data-stagger>\n<a class=\"card card--media card--big c-8\" href=\"macchine.html\"><div class=\"media\" style=\"--ratio:16/9\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/stron v class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Missione<\/p><h2 data-lines>Innovazione tecnologica, qualità e personalizzazione<\/h2>\n<p data-reveal>La missione è portare l’innovazione tecnologica nel settore del vetro automotive, puntando su qualità, personalizzazione e attenzione alla sostenibilità. Un team dedicato risponde con prontezza alle dinamiche del mercato.<\/p><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Sistema di visione<br>Foto originale AI Srl da inserire in<\/span><code>img/sistema-visione-01.webp<\/code><\/div><img src=\"img/sistema-visione-01.webp\" alt=\"Sistema di visione artificiale AI Srl\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><\/div><\/div><\/section><section class=\"sec dark sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Valori<\/p><h2 data-lines>Cinque priorità in ogni progetto<\/h2><\/div>\n<div class=\"g12\" data-stagger>\n<div class=\"card c-7\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-bulb\"/><\/svg><\/span><h3>Innovazione<\/h3><p>Portiamo stampa digitale e visione artificiale nel settore del vetro automotive.<\/p><\/div>\n<div class=\"card c-5\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-sliders\"/><\/svg><\/span><h3>Personalizzazione<\/h3><p>Soluzioni che seguono le richieste di design e le esigenze di ogni cliente.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-gauge\"/><\/svg><\/span><h3>Efficienza produttiva<\/h3><p>Preparazione rapida e cambi di produzione più veloci rispetto alla serigrafia.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-drop\"/><\/svg><\/span><h3>Attenzione agli sprechi<\/h3><p>Uso ottimizzato dell’inchiostro e controllo qualità per contenere gli scarti.<\/p><\/div>\n<div class=\"card c-4\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-headset\"/><\/svg><\/span><h3>Supporto tecnico<\/h3><p>Un team dedicato offre supporto e consulenza personalizzata.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"sec\"><div class=\"wrap split\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Soluzioni integrate<\/p><h2 data-lines>Stampa digitale e visione artificiale, insieme<\/h2>\n<p data-reveal>Prima della stampa, un sistema di visione adatta l’immagine all’orientamento del vetro. Dopo la stampa, su richiesta, un modulo dedicato controlla il risultato e gestisce gli scarti.<\/p>\n<ul class=\"checks\" data-reveal>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span>Rilevamento dei difetti di stampa e feedback all’operatore.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span>Indicazioni per risolvere i problemi e ottimizzare il flusso di lavoro.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span>Impianti esistenti aggiornabili con il revamping.<\/span><\/li><\/ul>\n<div data-reveal><a class=\"link-arrow\" href=\"macchine.html\"><span class=\"t\">Scopri le macchine<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a><\/div><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidde  revamping: lo valutiamo insieme.<\/p>\n<a class=\"btn btn--primary\" href=\"contatti.html\">Parliamo del tuo progetto<svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a>\n<p class=\"cta-contacts\"><a href=\"tel:+393455694696\">+39 345 569 4696<\/a><a href=\"mailto:info@aisrl.info\">info@aisrl.info<\/a><\/p>\n<\/div><\/div><\/section>\n<\/main>\n<footer class=\"site-footer\">\n<div class=\"wrap\">\n<div class=\"foot-grid\">\n<div class=\"foot-brand\">\n<div class=\"wm\" role=\"img\" aria-label=\"AI Srl – Redefine Printing\"><span class=\"wm-top\"><b>AI<\/b><i>Srl<\/i><\/span><small>Redefine Printing<\/small><\/div>\n<p>Soluzioni di stampa digitale e controllo qualità per il vetro automotive.<\/p>\n<\/div>\n<div><h2>Sitemap<\/h2><ul><li><a href=\"index.html\">Home<\/a><\/li><li><a href=\"azienda.html\">Azienda<\/a><\/li><li><a href=\"digital-print.html\">Digital Print<\/a><\/li><li><a href=\"macchine.html\">Le nostre macchine<\/a><\/li><li><a href=\"revamping.html\">Revamping<\/a><\/li><li><a href=\"lavora-con-noi.html\">Lavora con noi<\/a><\/li><li><a href=\"contatti.html\">Contatti<\/a><\/li><\/ul><\/div>\n<div><h2>Contatti<\/h2><ul class=\"foot-contacts\">\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-phone\"/><\/svg><a href=\"tel:+393455694696\">+39 345 569 4696<\/a><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-mail\"/><\/svg><a href=\"mailto:info@aisrl.info\">info@aisrl.info<\/a><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-pin\"/><\/svg><span>Via Erasmo Piaggio, SNC, 66100 Chieti<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><a href=\"https://maps.app.goo.gl/uAkSi4SZFFc4VyqXA\" target=\"_blank\" rel=\"noopener\">Indicazioni stradali<\/a><\/li>\n<\/ul><\/div>\n<div><h2>Dati societari e informative<\/h2>\n<div class=\"todo\"><b>Da completare con i dati forniti da AI Srl:<\/b> ragione sociale completa, partita IVA, sede legale, numero REA e capitale sociale; informativa privacy e cookie policy.<\/div>\n<\/div>\n<\/div>\n<div class=\"foot-bottom\"><span>© AI Srl – Artificial Intelligence – Redefine Printing<\/span><button class=\"motion-toggle\" type=\"button\" aria-pressed=\"false\">Movimenti di sfondo: attivi<\/button><span>Tutti i diritti riservati<\/span><\/div>\n<\/div>\n<\/footer>\n\n<script>/* Configurazione del sito AI Srl.\n   MODULI DI CONTATTO: il sito è statico e non può inviare email da solo.\n   Inserire qui l'indirizzo (endpoint) di un servizio di invio moduli, ad esempio Formspree, Getform o un proprio script,\n   configurato per consegnare i messaggi a:\n     - formEndpoint     → info@aisrl.info            (pagina Contatti)\n     - careersEndpoint  → collaboration@aisrl.info   (pagina Lavora con noi; se vuoto usa formEndpoint)\n   Finché i campi restano vuoti i moduli mostrano un avviso di configurazione e NON mostrano mai una conferma di invio. */\nwindow.AI_SITE_CONFIG = {\n  formEndpoint: \"\",\n  careersEndpoint: \"\"\n};\n\n/* AI Srl – sistema di movimento e interazioni (JavaScript nativo, CSS e SVG, nessuna libreria).\n   Principi: transform e opacity; contenuti visibili se lo script non parte (la classe \"anim\" viene aggiunta qui);\n   con prefers-reduced-motion nessuna animazione di scorrimento, nessun avanzamento automatico, nessun movimento continuo. */\n(function () {\n  'use strict';\n  var d = document, root = d.documentElement;\n  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n  var ANIM = !reduce;\n  if (ANIM) root.classList.add('anim');\n\n  function $(s, c) { return (c || d).querySelector(s); }\n  function $$(s, c) { return Array.prototype.slice.call((c || d).querySelectorAll(s)); }\n  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\n  function lerp(a, b, t) { return a + (b - a) * t; }\n  function ease \n<div class=\"wrap header-in\">\n<a class=\"brand\" href=\"index.html\" aria-label=\"AI Srl – Redefine Printing: vai alla Home\">\n<img src=\"img/AI-SRL.png\" alt=\"\" height=\"40\" onload=\"this.parentNode.classList.add('has-logo')\">\n<span class=\"wm\"><span class=\"wm-top\"><b>AI<\/b><i>Srl<\/i><\/span><small>Redefine Printing<\/small><\/span>\n<\/a>\n<button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"menu\" aria-label=\"Apri il menu\"><svg class=\"ico ico-open\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-menu\"/><\/svg><svg class=\"ico ico-close\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-close\"/><\/svg><\/button>\n<nav class=\"menu\" id=\"menu\" aria-label=\"Navigazione principale\">\n<ul class=\"menu-list\">\n<li class=\"nav-home\" style=\"--i:0\"><a href=\"index.html\">Home<\/a><\/li>\n<li style=\"--i:1\"><a href=\"azienda.html\">Azienda<\/a><\/li>\n<li style=\"--i:2\"><a href=\"digital-print.html\" aria-current=\"page\">Digital Print<\/a><\/li>\n<li style=\"--i:3\"><a href=\"macchine.html\">Le nostre macchine<\/a><\/li>\n<li style=\"--i:4\"><a href=\"revamping.html\">Revamping<\/a><\/li>\n<li style=\"--i:5\"><a href=\"lavora-con-noi.html\">Lavora con noi<\/a><\/li>\n<li style=\"--i:6\"><a href=\"contatti.html\">Contatti<\/a><\/li>\n<li class=\"menu-cta\" style=\"--i:7\"><a class=\"btn btn--primary\" href=\"contatti.html\">Parliamo del tuo progetto<svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a><\/li>\n<\/ul>\n<div class=\"menu-foot\"><span>Via Erasmo Piaggio, SNC, 66100 Chieti<\/span><a href=\"tel:+393455694696\">+39 345 569 4696<\/a><a href=\"mailto:info@aisrl.info\">info@aisrl.info<\/a><\/div>\n<\/nav>\n<\/div>\n<\/header>\n<main id=\"content\">\n<section class=\"band\"><div class=\"band-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 700 400\" preserveAspectRatio=\"xMaxYMid slice\" focusable=\"false\"><g transform=\"translate(450 215) rotate(-6) scale(.8)\"><path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L300 130 Q306 160 276 160 L-276 160 Q-306 160 -300 130Z\" fill=\"url(#g-glass)\" stroke=\"#fff\" stroke-opacity=\".4\" stroke-width=\"1.6\"/><g class=\"refl\"><polygon points=\"-170,-160 -90,-160 40,170 -40,170\" fill=\"url(#g-refl)\"/><\/g><\/g><g class=\"hline\"><path d=\"M-80 80 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 330 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><\/g><\/svg><\/div><div class=\"wrap band-in\">\n<ol class=\"crumbs\"><li><a href=\"index.html\">Home<\/a><\/li><li aria-current=\"page\">Digital Print<\/li><\/ol>\n<h1>Digital Print: la stampa digitale per il vetro automotive<\/h1>\n<p class=\"lead\">Grafiche personalizzate e complesse, senza nuove maschere o stencil e con cambi di produzione più rapidi.<\/p>\n<\/div><\/section><section class=\"sec\"><div class=\"wrap split\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Dalla serigrafia al digitale<\/p><h2 data-lines>Una svolta per il vetro automotive<\/h2>\n<p data-reveal>Molte aziende usano ancora la serigrafia, che comporta tempi di cambio produzione elevati e limiti nelle grafiche complesse. Il mercato richiede invece grafiche personalizzate e prestazioni avanzate, che la stampa digitale rende possibili.<\/p>\n<p data-reveal>AI Srl propone soluzioni di stampa digitale integrabili con il controllo qualità basato su visione artificiale.<\/p><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Stampa digitale su vetro<br>Foto originale AI Srl da inserire in<\/span><code>img/vetro-1.webp<\/code><\/div><img src=\"img/vetro-1.webp\" alt=\"Vetro automotive con grafica stampata in digitale\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><\/div><\/div><\/section><section class=\"sec sec--paper sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Personalizzazione<\/p><h2 data-lines>Una grafica diversa su ogni vetro<\/h2><p data-reveal>Scegli una grafica dimostrativa e guardala su una sagoma di vetro. Con la stampa digitale non servono nuove maschere o stencil per cambiare disegno.<\/p><\/div>\n<div class=\"demo\" data-demo>\n<div class=\"demo-fig glass\" data-reveal><svg viewBox=\"0 0 640 340\" role=\"img\" aria-labelledby=\"dm-t\" focusable=\"false\">\n<title id=\"dm-t\">Sagoma di vetro con grafica dimostrativa<\/title>\n<g transform=\"translate(320 172)\"><clipPath id=\"dm-clip\"><path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L300 130 Q306 160 276 160 L-276 160 Q-306 160 -300 130Z\"/><\/clipPath>\n<path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L300 130 Q306 160 276 160 L-276 160 Q-306 160 -300 130Z\" fill=\"url(#g-glass)\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.8\"/>\n<g clip-path=\"url(#dm-clip)\">\n<g class=\"demo-g\" data-g=\"dots\"><path d=\"M-310 -160H310V-70H-310Z\" fill=\"url(#p-dots)\"/><path d=\"M-310 -70H310\" stroke=\"#fff\" stroke-opacity=\".6\"/><\/g><g class=\"demo-g\" data-g=\"lines\"><path d=\"M-300 170 L-120 -170\" stroke=\"#fff\" stroke-opacity=\".75\" stroke-width=\"1.5\"/><path d=\"M-254 170 L-74 -170\" stroke=\"#fff\" stroke-opacity=\".75\" stroke-width=\"1.5\"/><path d=\"M-208 170 L-28 -170\" stroke=\"#fff\" stroke-opacity=\".75\" stroke-width=\"1.5\"/><path d=\"M-162 170 L18 -170\" stroke=\"#fff\" stroke-opacity=\".75\" stroke-width=\"1.5\"/><path d=\"M-116 170 L64 -170\" stroke=\"#fff\" stroke-opacity=\".75\" stroke-width=\"1.5\"/><path d=\"M-70 170 L110 -170\" strok  cx=\"-82\" cy=\"-52\" r=\"3.64\"/><circle cx=\"-82\" cy=\"-14\" r=\"3.64\"/><circle cx=\"-82\" cy=\"24\" r=\"3.64\"/><circle cx=\"-82\" cy=\"62\" r=\"3.64\"/><circle cx=\"-54\" cy=\"-90\" r=\"3.38\"/><circle cx=\"-54\" cy=\"-52\" r=\"3.38\"/><circle cx=\"-54\" cy=\"-14\" r=\"3.38\"/><circle cx=\"-54\" cy=\"24\" r=\"3.38\"/><circle cx=\"-54\" cy=\"62\" r=\"3.38\"/><circle cx=\"-26\" cy=\"-90\" r=\"3.12\"/><circle cx=\"-26\" cy=\"-52\" r=\"3.12\"/><circle cx=\"-26\" cy=\"-14\" r=\"3.12\"/><circle cx=\"-26\" cy=\"24\" r=\"3.12\"/><circle cx=\"-26\" cy=\"62\" r=\"3.12\"/><circle cx=\"2\" cy=\"-90\" r=\"2.86\"/><circle cx=\"2\" cy=\"-52\" r=\"2.86\"/><circle cx=\"2\" cy=\"-14\" r=\"2.86\"/><circle cx=\"2\" cy=\"24\" r=\"2.86\"/><circle cx=\"2\" cy=\"62\" r=\"2.86\"/><circle cx=\"30\" cy=\"-90\" r=\"2.60\"/><circle cx=\"30\" cy=\"-52\" r=\"2.60\"/><circle cx=\"30\" cy=\"-14\" r=\"2.60\"/><circle cx=\"30\" cy=\"24\" r=\"2.60\"/><circle cx=\"30\" cy=\"62\" r=\"2.60\"/><circle cx=\"58\" cy=\"-90\" r=\"2.34\"/><circle cx=\"58\" cy=\"-52\" r=\"2.34\"/><circle cx=\"58\" cy=\"-14\" r=\"2.34\"/><circle cx=\"58\" cy=\"24\" r=\"2.34\"/><circle cx=\"58\" cy=\"62\" r=\"2.34\"/><circle cx=\"86\" cy=\"-90\" r=\"2.08\"/><circle cx=\"86\" cy=\"-52\" r=\"2.08\"/><circle cx=\"86\" cy=\"-14\" r=\"2.08\"/><circle cx=\"86\" cy=\"24\" r=\"2.08\"/><circle cx=\"86\" cy=\"62\" r=\"2.08\"/><circle cx=\"114\" cy=\"-90\" r=\"1.82\"/><circle cx=\"114\" cy=\"-52\" r=\"1.82\"/><circle cx=\"114\" cy=\"-14\" r=\"1.82\"/><circle cx=\"114\" cy=\"24\" r=\"1.82\"/><circle cx=\"114\" cy=\"62\" r=\"1.82\"/><circle cx=\"142\" cy=\"-90\" r=\"1.56\"/><circle cx=\"142\" cy=\"-52\" r=\"1.56\"/><circle cx=\"142\" cy=\"-14\" r=\"1.56\"/><circle cx=\"142\" cy=\"24\" r=\"1.56\"/><circle cx=\"142\" cy=\"62\" r=\"1.56\"/><circle cx=\"170\" cy=\"-90\" r=\"1.30\"/><circle cx=\"170\" cy=\"-52\" r=\"1.30\"/><circle cx=\"170\" cy=\"-14\" r=\"1.30\"/><circle cx=\"170\" cy=\"24\" r=\"1.30\"/><circle cx=\"170\" cy=\"62\" r=\"1.30\"/><circle cx=\"198\" cy=\"-90\" r=\"1.04\"/><circle cx=\"198\" cy=\"-52\" r=\"1.04\"/><circle cx=\"198\" cy=\"-14\" r=\"1.04\"/><circle cx=\"198\" cy=\"24\" r=\"1.04\"/><circle cx=\"198\" cy=\"62\" r=\"1.04\"/><circle cx=\"226\" cy=\"-90\" r=\"0.78\"/><circle cx=\"226\" cy=\"-52\" r=\"0.78\"/><circle cx=\"226\" cy=\"-14\" r=\"0.78\"/><circle cx=\"226\" cy=\"24\" r=\"0.78\"/><circle cx=\"226\" cy=\"62\" r=\"0.78\"/><\/g><\/g>\n<g class=\"refl\"><polygon points=\"-170,-180 -90,-180 40,190 -40,190\" fill=\"url(#g-refl)\"/><\/g><\/g><\/g><\/svg><p class=\"fig-tag\" style=\"margin-top:6px\" data-demo-cap aria-live=\"polite\">Esempio 1: fascia di punti lungo il bordo superiore della sagoma.<\/p><\/div>\n<div style=\"display:grid;gap:16px\" data-reveal>\n<div class=\"opts\" role=\"radiogroup\" aria-label=\"Grafiche dimostrative\"><button class=\"opt\" type=\"button\" role=\"radio\" aria-checked=\"true\" data-cap=\"Esempio 1: fascia di punti lungo il bordo superiore della sagoma.\"><b>Banda a punti<\/b><span>Una fascia di punti lungo il bordo.<\/span><\/button><button class=\"opt\" type=\"button\" role=\"radio\" aria-checked=\"false\" data-cap=\"Esempio 2: tratti sottili e un riquadro, per mostrare un disegno di linea.\"><b>Linee tecniche<\/b><span>Tratti sottili e un riquadro.<\/span><\/button><button class=\"opt\" type=\"button\" role=\"radio\" aria-checked=\"false\" data-cap=\"Esempio 3: un simbolo geometrico generico, non un marchio reale.\"><b>Marchio dimostrativo<\/b><span>Un simbolo geometrico generico.<\/span><\/button><button class=\"opt\" type=\"button\" role=\"radio\" aria-checked=\"false\" data-cap=\"Esempio 4: punti che diminuiscono di dimensione, per evocare una sfumatura.\"><b>Sfumatura di punti<\/b><span>Punti che cambiano dimensione.<\/span><\/button><\/div>\n<p class=\"note\"><b>Esempio visivo illustrativo.<\/b> Non è un configuratore commerciale né una simulazione delle prestazioni reali della stampa.<\/p>\n<\/div><\/div><\/div><\/section><section class=\"sec dark sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Vantaggi<\/p><h2 data-lines>Cosa cambia con la stampa digitale<\/h2><\/div>\n<div class=\"g12\" data-stagger>\n<div class=\"card c-5\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-print\"/><\/svg><\/span><h3>Alta risoluzione e dettaglio<\/h3><p>Immagini nitide e colori vivaci, per le richieste estetiche più attuali.<\/p><\/div>\n<div class=\"card c-7\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-sliders\"/><\/svg><\/span><h3>Personalizzazione rapida<\/h3><p>Ogni vetro può essere unico: si cambia design senza creare nuove maschere o stencil.<\/p><\/div>\n<div class=\"card c-7\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-clock\"/><\/svg><\/span><h3>Cambi produzione più rapidi<\/h3><p>La preparazione è molto più veloce rispetto alla serigrafia.<\/p><\/div>\n<div class=\"card c-5\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flex\"/><\/svg><\/span><h3>Adatta a ogni tiratura<\/h3><p>Una soluzione flessibile per produzioni piccole e grandi, anche su richiesta.<\/p><\/div>\n<div class=\"card c-6\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-drop\"/><\/svg><\/span><h3>Inchiostro ottimizzato<\/h3><p>Un uso più mirato dell’inchiostro riduce gli sprechi.<\/p><\/div>\n<div class=\"card c-6\"><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-layers\"/><\/svg><\/span><h3>Grafiche complesse<\/h3><p>Si superano i limiti della serigrafia con grafiche intricate e innovative.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"sec\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Modalità di stampa<\/p><h2 data-lines>Tre modi di governare la goccia di inchiostro<\/h2><p data-reveal>La modalità si sceglie in base alle esigenze di qualità, di sfumatura e di produzione.<\/p><\/div>\n<div data-tabs data-reveal><div class=\"tablist\" role=\"tablist\" aria-label=\"Modalità di stampa digitale\"><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-m-su\" aria-controls=\"m-su\" aria-selected=\"false\" tabindex=\"-1\">SU<\/button><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-m-stv\" aria-controls=\"m-stv\" aria-selected=\"false\" tabindex=\"-1\">STV<\/button><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-m-sqv\" aria-controls=\"m-sqv\" aria-selected=\"false\" tabindex=\"-1\">SQV<\/button><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"m-su\" aria-labelledby=\"t-m-su\"><div class=\"panel-grid\"><div><span class=\"tag\">SU<\/span><h3 style=\"margin-top:12px\">Stampa uniforme<\/h3><p style=\"margin-top:10px\">Una testina genera gocce di inchiostro di dimensioni uniformi e alla stessa velocità, per una distribuzione omogenea.<\/p><\/div><ul class=\"card-list\"><li><b>Qualità costante:<\/b> ogni goccia è identica, quindi l’immagine è uniforme<\/li><li><b>Semplicità:<\/b> facile da configurare, ideale per piccole produzioni o prove di stampa rapide<\/li><li><b>Efficienza:<\/b> riduce gli sprechi di inchiostro<\/li><\/ul><\/div><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"m-stv\" aria-labelledby=\"t-m-stv\"><div class=\"panel-grid\"><div><span class=\"tag\">STV<\/span><h3 style=\"margin-top:12px\">Stampa a tonalità variabile<\/h3><p style=\"margin-top:10px\">Gocce di dimensioni differenti rappresentano vari livelli di grigio, con una gamma più ampia di sfumature.<\/p><\/div><ul class=\"card-list\"><li><b>Dettagli e sfumature:<\/b> gradazioni tonali precise, adatte a immagini complesse<\/li><li><b>Creatività:<\/b> ampia gamma di effetti visivi e transizioni morbide<\/li><li><b>Efficienza d’inchiostro:<\/b> utilizzo ottimizzato senza compromettere la qualità<\/li><\/ul><\/div><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"m-sqv\" aria-labelledby=\"t-m-sqv\"><div class=\"panel-grid\"><div><span class=\"tag\">SQV<\/span><h3 style=\"margin-top:12px\">Stampa a quantità variabile<\/h3><p style=\"margin-top:10px\">La testina lavora in modalità binaria con frequenza variabile, adattandosi alla quantità di inchiostro richiesta.<\/p><\/div><ul class=\"card-list\"><li><b>Precisione:<\/b> controllo accurato della quantità di inchiostro per applicazioni personalizzate<\/li><li><b>Flessibilità:<\/b> si adatta alle esigenze del cliente<\/li><li><b>Ottimizzazione:<\/b> migliora l’efficienza produttiva e riduce i tempi di fermo macchina<\/li><\/ul><\/div><\/div><\/div><\/div><\/section><section class=\"sec sec--paper sec--grid\"><div class=\"wrap split split--rev\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Integrazione tecnologica<\/p><h2 data-lines>Si combina con altre tecnologie digitali<\/h2>\n<p data-reveal>La stampa digitale si abbina facilmente ad altre tecnologie, come il taglio e l’incisione laser, per realizzare prodotti complessi e di alta qualità.<\/p>\n<p data-reveal>Con il sistema di visione, la stampa può essere affiancata da un controllo qualità basato su visione artificiale, con feedback in caso di errori e guida all’operatore.<\/p>\n<div data-reveal><a class=\"link-arrow\" href=\"macchine.html#controllo-qualita\"><span class=\"t\">Il controllo qualità<\/span><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a><\/div><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Testa di stampa<br>Foto originale AI Srl da inserire in<\/span><code>img/testa-di-stampa.webp<\/code><\/div><img src=\"img/testa-di-stampa.w logo')\">\n<span class=\"wm\"><span class=\"wm-top\"><b>AI<\/b><i>Srl<\/i><\/span><small>Redefine Printing<\/small><\/span>\n<\/a>\n<button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"menu\" aria-label=\"Apri il menu\"><svg class=\"ico ico-open\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-menu\"/><\/svg><svg class=\"ico ico-close\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-close\"/><\/svg><\/button>\n<nav class=\"menu\" id=\"menu\" aria-label=\"Navigazione principale\">\n<ul class=\"menu-list\">\n<li class=\"nav-home\" style=\"--i:0\"><a href=\"index.html\">Home<\/a><\/li>\n<li style=\"--i:1\"><a href=\"azienda.html\">Azienda<\/a><\/li>\n<li style=\"--i:2\"><a href=\"digital-print.html\">Digital Print<\/a><\/li>\n<li style=\"--i:3\"><a href=\"macchine.html\" aria-current=\"page\">Le nostre macchine<\/a><\/li>\n<li style=\"--i:4\"><a href=\"revamping.html\">Revamping<\/a><\/li>\n<li style=\"--i:5\"><a href=\"lavora-con-noi.html\">Lavora con noi<\/a><\/li>\n<li style=\"--i:6\"><a href=\"contatti.html\">Contatti<\/a><\/li>\n<li class=\"menu-cta\" style=\"--i:7\"><a class=\"btn btn--primary\" href=\"contatti.html\">Parliamo del tuo progetto<svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a><\/li>\n<\/ul>\n<div class=\"menu-foot\"><span>Via Erasmo Piaggio, SNC, 66100 Chieti<\/span><a href=\"tel:+393455694696\">+39 345 569 4696<\/a><a href=\"mailto:info@aisrl.info\">info@aisrl.info<\/a><\/div>\n<\/nav>\n<\/div>\n<\/header>\n<main id=\"content\">\n<section class=\"band\"><div class=\"band-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 700 400\" preserveAspectRatio=\"xMaxYMid slice\" focusable=\"false\"><g transform=\"translate(450 215) rotate(-6) scale(.8)\"><path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L300 130 Q306 160 276 160 L-276 160 Q-306 160 -300 130Z\" fill=\"url(#g-glass)\" stroke=\"#fff\" stroke-opacity=\".4\" stroke-width=\"1.6\"/><g class=\"refl\"><polygon points=\"-170,-160 -90,-160 40,170 -40,170\" fill=\"url(#g-refl)\"/><\/g><\/g><g class=\"hline\"><path d=\"M-80 80 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 330 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><\/g><\/svg><\/div><div class=\"wrap band-in\">\n<ol class=\"crumbs\"><li><a href=\"index.html\">Home<\/a><\/li><li aria-current=\"page\">Le nostre macchine<\/li><\/ol>\n<h1>Le nostre macchine: modulari e adattabili all’inchiostro<\/h1>\n<p class=\"lead\">Una struttura modulare per stampare con inchiostri diversi, con visione prima della testa di stampa e controllo qualità opzionale dopo.<\/p>\n<\/div><\/section><section class=\"sec\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Inchiostri<\/p><h2 data-lines>Una macchina modulare per ogni tipo di inchiostro<\/h2>\n<p data-reveal>Nel settore automotive si usano diversi inchiostri (IR, UV e ad acqua lavabile): per questo la macchina è modulare e si adatta a ciascuno. Le esigenze di riscaldamento dipendono dall’inchiostro scelto.<\/p><\/div>\n<div data-tabs data-reveal><div class=\"tablist\" role=\"tablist\" aria-label=\"Tipologie di inchiostro\"><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-ink-cer\" aria-controls=\"ink-cer\" aria-selected=\"false\" tabindex=\"-1\">Ceramici<\/button><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-ink-ir\" aria-controls=\"ink-ir\" aria-selected=\"false\" tabindex=\"-1\">IR<\/button><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-ink-uv\" aria-controls=\"ink-uv\" aria-selected=\"false\" tabindex=\"-1\">UV<\/button><button class=\"tab\" role=\"tab\" type=\"button\" id=\"t-ink-aq\" aria-controls=\"ink-aq\" aria-selected=\"false\" tabindex=\"-1\">Acqua lavabile<\/button><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"ink-cer\" aria-labelledby=\"t-ink-cer\"><div class=\"panel-grid\"><div><h3>Inchiostri ceramici<\/h3><p style=\"margin-top:10px\">Le macchine permettono la stampa con inchiostri ceramici, per il vetro artistico e per il vetro automotive.<\/p><\/div><div class=\"heat\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flame\"/><\/svg><small>Riscaldamento<\/small><p>Dipende dall’inchiostro utilizzato: da definire con AI Srl in base al progetto.<\/p><\/div><\/div><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"ink-ir\" aria-labelledby=\"t-ink-ir\"><div class=\"panel-grid\"><div><h3>Inchiostri IR<\/h3><p style=\"margin-top:10px\">Tra le tipologie più usate nel settore automotive.<\/p><\/div><div class=\"heat\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flame\"/><\/svg><small>Riscaldamento<\/small><p>Richiede riscaldi prima e dopo la stampa.<\/p><\/div><\/div><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"ink-uv\" aria-labelledby=\"t-ink-uv\"><div class=\"panel-grid\"><div><h3>Inchiostri UV<\/h3><p style=\"margin-top:10px\">Tra le tipologie più usate nel settore automotive.<\/p><\/div><div class=\"heat\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flame\"/><\/svg><small>Riscaldamento<\/small><p>Non sono necessari riscaldi.<\/p><\/div><\/div><\/div><div class=\"tabpanel\" role=\"tabpanel\" id=\"ink-aq\" aria-labelledby=\"t-ink-aq\"><div class=\"panel-grid\"><div><h3>Inchiostri ad acqua lavabile<\/h3><p style=\"margin-top:10px\">Tra le tipologie più usate nel settore automotive.<\/p><\/div><div class=\"heat\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-flame\"/><\/svg><small>Riscaldamento<\/small><p>Dipende dall’inchiostro utilizzato: da definire con AI Srl in base al progetto.<\/p><\/div><\/div><\/div><\/div><\/div><\/section><section class=\"sec dark sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Visione<\/p><h2 data-lines>Due sistemi di visione, due ruoli diversi<\/h2><p data-reveal>Il primo è sempre presente. Il secondo si aggiunge solo su richiesta del cliente finale.<\/p><\/div>\n<div class=\"compare\" data-stagger>\n<div class=\"card\"><span class=\"tag\">Sempre presente<\/span><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-vision\"/><\/svg><\/span><h3>Prima della testa di stampa<\/h3><p>Il sistema di visione rileva l’orientamento del singolo pezzo in transito e permette di adattare l’immagine da stampare.<\/p><\/div>\n<div class=\"card card--opt\"><span class=\"tag tag--opt\">Opzionale, su richiesta<\/span><span class=\"ico-tile\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><\/span><h3>Dopo la stampa<\/h3><p>A valle della testa di stampa si può installare un modulo aggiuntivo per il controllo qualità, con sistema di visione dedicato e gestione degli scarti.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"sec sec--paper sec--grid\" id=\"galleria\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Galleria tecnica<\/p><h2 data-lines>I moduli in immagini<\/h2><p data-reveal>Seleziona un’immagine per ingrandirla. Usa le frecce della tastiera per scorrere e Esc per chiudere.<\/p><\/div>\n<div class=\"gallery\" data-gallery data-stagger>\n<figure class=\"gal-item\" data-title=\"Testa di stampa\" data-caption=\"Testa di stampa\"><div class=\"gal-frame\"><div class=\"media\" style=\"--ratio:4/3\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Testa di stampa<br>Foto originale AI Srl da inserire in<\/span><code>img/testa-di-stampa.webp<\/code><\/div><img src=\"img/testa-di-stampa.webp\" alt=\"Testa di stampa\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><button class=\"gal-open\" type=\"button\" aria-label=\"Ingrandisci l’immagine: Testa di stampa\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-expand\"/><\/svg><\/button><\/div><figcaption><b>Testa di stampa<\/b><span>Il modulo che applica la grafica sul vetro.<\/span><\/figcaption><\/figure>\n<figure class=\"gal-item\" data-title=\"Rulliera\" data-caption=\"Rulliera\"><div class=\"gal-frame\"><div class=\"media\" style=\"--ratio:4/3\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Rulliera<br>Foto originale AI Srl da inserire in<\/span><code>img/rulliera.webp<\/code><\/div><img src=\"img/rulliera.webp\" alt=\"Rulliera\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><button class=\"gal-open\" type=\"button\" aria-label=\"Ingrandisci l’immagine: Rulliera\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-expand\"/><\/svg><\/button><\/div><figcaption><b>Rulliera<\/b><span>Accompagna i pezzi in transito lungo la linea.<\/span><\/figcaption><\/figure>\n<figure class=\"gal-item\" data-title=\"Planimetria del sistema di visione\" data-caption=\"Planimetria del sistema di visione dell’orientamento del prodotto da stampare\"><div class=\"gal-frame\"><div class=\"media media--contain\" style=\"--ratio:4/3\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Planimetria del sistema di visione<br>Foto originale AI Srl da inserire in<\/span><code>img/pianta-manutenzione.webp<\/code><\/div><img src=\"img/pianta-manutenzione.webp\" alt=\"Planimetria del sistema di visione dell’orientamento del prodotto da stampare\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><button class=\"gal-open\" type=\"button\" aria-label=\"Ingrandisci l’immagine: Planimetria del sistema di visione\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-expand\"/><\/svg><\/button><\/div><figcaption><b>Planimetria del sistema di visione<\/b><span>Il sistema di visione che rileva l’orientamento del prodotto da stampare.<\/span><\/figcaption><\/figure>\n<figure class=\"gal-item\" data-title=\"Vista dall’alto del sistema di visione\" data-caption=\"Vista dall’alto del sistema di visione dell’orientamento del prodotto da stampare\"><div class=\"gal-frame\"><div class=\"media\" style=\"--ratio:4/3\"><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Vista dall’alto del sistema di visione<br>Foto originale AI Srl da inserire in<\/span><code>img/vista-dallalto.webp<\/code><\/div><img src=\"img/vista-dallalto.webp\" alt=\"Vista dall’alto del sistema di visione dell’orientamento del prodotto da stampare\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><button class=\"gal-open\" type=\"button\" aria-label=\"Ingrandisci l’immagine: Vista dall’alto del sistema di visione\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-expand\"/><\/svg><\/button><\/div><figcaption><b>Vista dall’alto del sistema di visione<\/b><span>Il sistema di visione visto dall’alto, sopra il pezzo da stampare.<\/span><\/figcaption><\/figure>\n<\/div><\/div>\n<dialog class=\"lb\" id=\"lightbox\" aria-label=\"Immagine ingrandita\"><div class=\"lb-in\">\n<div class=\"lb-top\"><span class=\"lb-count\" aria-live=\"polite\"><\/span><button class=\"ctrl-btn lb-close\" type=\"button\" aria-label=\"Chiudi l’immagine ingrandita\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-close\"/><\/svg><\/button><\/div>\n<div class=\"lb-stage\"><\/div>\n<div class=\"lb-bottom\"><p class=\"lb-cap\"><\/p><div class=\"lb-nav\"><button class=\"ctrl-btn lb-prev\" type=\"button\" aria-label=\"Immagine precedente\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-prev\"/><\/svg><\/button><button class=\"ctrl-btn lb-next\" type=\"button\" aria-label=\"Immagine successiva\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/button><\/div><\/div>\n<\/div><\/dialog><\/section><section class=\"sec\" id=\"controllo-qualita\"><div class=\"wrap split\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Controllo qualità<\/p><h2 data-lines>Visione artificiale dopo la stampa<\/h2>\n<p data-reveal>Il modulo opzionale usa un sistema di visione artificiale posizionato dopo la testa di stampa. Controlla il risultato, segnala i difetti e aiuta l’operatore a intervenire.<\/p>\n<ul class=\"checks\" data-reveal>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Rilevamento dei difetti:<\/b> individua gli errori di stampa subito dopo la stampa.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Feedback:<\/b> segnala il problema, per correzioni tempestive.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Supporto all’operatore:<\/b> fornisce indicazioni per risolvere il problema e ottimizzare il flusso di lavoro.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Gestione degli scarti:<\/b> separa i pezzi che non soddisfano i requisiti.<\/span><\/li><\/ul>\n<p data-reveal>Il sistema può intervenire con correzioni in tempo reale. Gli aspetti di integrazione si definiscono con AI Srl in base all’impianto.<\/p><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Sistema di visione<br>Foto originale AI Srl da inserire in<\/span><code>img/sistema-visione-02.webp<\/code><\/div><img src=\"img/sistema-visione-02.webp\" alt=\"Sistema di visione artificiale su una macchina AI Srl\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><\/div><\/div><\/section><section class=\"sec dark sec--grid\" id=\"logo-print\"><div class=\"wrap split split--rev\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Logo Print<\/p><h2 data-lines>Piccoli loghi su vetri automotive<\/h2>\n<p data-reveal>Logo Print è la soluzione di AI Srl per la stampa digitale di piccoli loghi su vetri automotive, per personalizzare i vetri con i marchi delle case automobilistiche.<\/p>\n<ul class=\"checks\" data-reveal>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Qualità:<\/b> stampa digitale ad alta risoluzione per loghi con dettagli nitidi.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Durata:<\/b> inchiostri speciali pensati per resistere nel tempo alle condizioni ambientali.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Flessibilità:<\/b> ogni dettaglio è personalizzato in base alle richieste del progetto.<\/span><\/li>\n<li><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-check\"/><\/svg><span><b>Supporto:<\/b> assistenza dalla progettazione alla stampa finale.<\/span><\/li><\/ul>\n<p data-reveal>Applicazioni: vetri laterali, vetri posteriori e vetri di sicurezza.<\/p>\n<div data-reveal><a class=\"btn btn--primary\" href=\"contatti.html\">Parla con noi di Logo Print<svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-arrow\"/><\/svg><\/a><\/div><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:6/7\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Logo su vetro automotive<br>Foto originale AI Srl da inserire in<\/span><code>img/img-finto-logo-vetro-942x1024.webp<\/code><\/div><img src=\"img/img-finto-logo-vetro-942x1024.webp\" alt=\"Esempio di logo stampato su vetro automotive\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><\/div><\/div><\/section><section class=\"cta\"><div class=\"cta-lines\" data-ambient aria-hidden=\"true\"><svg viewBox=\"0 0 1200 500\" preserveAspectRatio=\"xMidYMid slice\" focusable=\"false\"><g class=\"hline\"><path d=\"M-80 70 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 150 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 230 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 310 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 390 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 470 H1280\" stroke=\"#fff\" stroke-opacity=\".20\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><\/g><g transform=\"translate(980 260) rotate(-8) scale(.9)\"><path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L30 align-items:start}\n.foot-contacts .ico{width:1.15rem;height:1.15rem;margin-top:.3em;color:var(--azure)}\n.todo{padding:14px 16px;border:1px dashed rgba(255,255,255,.35);border-radius:var(--r);font-size:.9rem;line-height:1.55}\n.todo b{color:#fff;font-weight:600}\n.foot-bottom{margin-top:40px;padding-top:20px;border-top:1px solid var(--line-dark);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em}\n.motion-toggle{display:none;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid rgba(255,255,255,.35);border-radius:var(--r);background:transparent;color:#fff;font:inherit;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;cursor:pointer;transition:background-color var(--t-micro),color var(--t-micro)}\n.js .motion-toggle{display:inline-flex}\n.motion-toggle:hover{background:#fff;color:var(--deep)}\n\n/* ---------- Ingressi allo scorrimento ---------- */\n.anim [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity var(--t-in) var(--ease),transform var(--t-in) var(--ease);transition-delay:calc(var(--i,0)*80ms)}\n.anim [data-reveal].in{opacity:1;transform:none}\n.draw{stroke-dasharray:1;stroke-dashoffset:0}\n.anim .draw{stroke-dashoffset:1}\n.anim .in .draw,.anim .draw.in{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s var(--ease);transition-delay:calc(var(--d,0)*120ms)}\n\n/* ---------- Transizioni tra pagine ---------- */\n@media (prefers-reduced-motion:no-preference){\n  @view-transition{navigation:auto}\n  ::view-transition-old(root){animation:vtOut .22s ease both}\n  ::view-transition-new(root){animation:vtIn .38s var(--ease) both}\n  @keyframes vtOut{to{opacity:0}}\n  @keyframes vtIn{from{opacity:0}}\n}\n\n/* ---------- Movimento ridotto ---------- */\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important asmo Piaggio, SNC, 66100 Chieti<\/span><a href=\"tel:+393455694696\">+39 345 569 4696<\/a><a href=\"mailto:info@aisrl.info\">info@aisrl.info<\/a><\/div>\n<\/nav>\n<\/div>\n<\/header>\n<main id=\"content\">\n<section class=\"band\"><div class=\"band-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 700 400\" preserveAspectRatio=\"xMaxYMid slice\" focusable=\"false\"><g transform=\"translate(450 215) rotate(-6) scale(.8)\"><path d=\"M-300 130 L-240 -120 Q-230 -150 -200 -150 L200 -150 Q230 -150 240 -120 L300 130 Q306 160 276 160 L-276 160 Q-306 160 -300 130Z\" fill=\"url(#g-glass)\" stroke=\"#fff\" stroke-opacity=\".4\" stroke-width=\"1.6\"/><g class=\"refl\"><polygon points=\"-170,-160 -90,-160 40,170 -40,170\" fill=\"url(#g-refl)\"/><\/g><\/g><g class=\"hline\"><path d=\"M-80 80 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><path d=\"M-80 330 H780\" stroke=\"#fff\" stroke-opacity=\".2\" stroke-width=\"1\" stroke-dasharray=\"4 12\" fill=\"none\"/><\/g><\/svg><\/div><div class=\"wrap band-in\">\n<ol class=\"crumbs\"><li><a href=\"index.html\">Home<\/a><\/li><li aria-current=\"page\">Revamping<\/li><\/ol>\n<h1>Revamping: dai nuova vita ai tuoi impianti<\/h1>\n<p class=\"lead\">Recupero e ammodernamento di componenti e apparecchiature, per valorizzare l’investimento già fatto.<\/p>\n<\/div><\/section><section class=\"sec\"><div class=\"wrap split\">\n<div class=\"split-copy\"><p class=\"eyebrow\" data-reveal>Ammodernamento<\/p><h2 data-lines>Più prestazioni dalle linee esistenti<\/h2>\n<p data-reveal>Con il revamping i sistemi esistenti diventano un’occasione per migliorare le prestazioni, aggiornare le tecnologie e rispondere alle nuove esigenze di mercato.<\/p>\n<p data-reveal>AI Srl è specializzata nel recupero e nell’ammodernamento di componenti e apparecchiature superate, integrando tecnologie recenti che rinnovano gli impianti per produttività, sicurezza ed efficienza energetica.<\/p><\/div>\n<div class=\"split-media\"><div class=\"media mask\" style=\"--ratio:4/3\" data-parallax><div class=\"media__fill\"><div class=\"media__ph\" aria-hidden=\"true\"><svg class=\"ico\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-image\"/><\/svg><strong>Segnaposto immagine<\/strong><span>Impianto in revamping<br>Foto originale AI Srl da inserire in<\/span><code>img/diverge-blog-1.jpg<\/code><\/div><img src=\"img/diverge-blog-1.jpg\" alt=\"Impianto industriale oggetto di revamping\" loading=\"lazy\" decoding=\"async\" onload=\"this.closest('.media').classList.add('is-loaded')\"><\/div><\/div><\/div><\/div><\/section><section class=\"sec dark sec--grid sec--shift\" data-shift><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Percorso<\/p><h2 data-lines>Dall’analisi alla valorizzazione dell’impianto<\/h2><p data-reveal>Quattro fasi per rinnovare una linea esistente. Scorri per vedere il percorso avanzare.<\/p><\/div>\n<div class=\"path\" data-path><div class=\"path-line\" aria-hidden=\"true\"><i><\/i><\/div><div class=\"pnode is-on\"><span class=\"num\">Fase 1<\/span><h3>Analisi<\/h3><p>Valutazione dell’impianto esistente e delle esigenze di produzione.<\/p><\/div><div class=\"pnode is-on\"><span class=\"num\">Fase 2<\/span><h3>Aggiornamento<\/h3><p>Recupero e ammodernamento di componenti e apparecchiature superate.<\/p><\/div><div class=\"pnode is-on\"><span class=\"num\">Fase 3<\/span><h3>Integrazione<\/h3><p>Inserimento di tecnologie di nuova generazione nell’impianto.<\/p><\/div><div class=\"pnode is-on\"><span class=\"num\">Fase 4<\/span><h3>Valorizzazione dell’impianto<\/h3><p>Più produttività, sicurezza ed efficienza energetica, per valorizzare l’investimento già effettuato.<\/p><\/div><\/div><\/div><\/section><section class=\"sec sec--paper sec--grid\"><div class=\"wrap\">\n<div class=\"sec-head\"><p class=\"eyebrow\" data-reveal>Benefici<\/p><h2 data-lines>Cosa può portare un revamping<\/h2><\/div>\n<div class=\"g12\" data-stagger>\n<div clas
